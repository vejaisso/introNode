<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>vfx-js + Biossonificador</title>
<style>
  :root{
    --bg:#0e120f; --panel:#161b17; --line:#2a332c; --ink:#e9efe7;
    --muted:#8fa091; --accent:#7fd88f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--ink); padding:24px; display:flex; flex-direction:column;
    align-items:center; gap:20px;
  }
  h1{font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600; margin:0;}
  .stage{
    position:relative; border-radius:10px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.5);
    border:1px solid var(--line);
  }
  #img{ display:block; width:340px; height:auto; }
  .panel{
    width:340px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px;
    display:flex; flex-direction:column; gap:12px;
  }
  .row{display:flex; flex-direction:column; gap:4px;}
  label{font-size:11px; color:var(--muted); display:flex; justify-content:space-between;}
  input[type=range]{ width:100%; accent-color:var(--accent); }
  button{
    background:var(--accent); color:#0e120f; border:none; border-radius:6px; padding:10px 14px;
    font-weight:700; font-size:13px; cursor:pointer; letter-spacing:.02em;
  }
  button:active{ transform:translateY(1px); }
  .secondary{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .hint{font-size:11px; color:var(--muted); line-height:1.5;}
  .log{
    font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted);
    max-height:70px; overflow-y:auto; border-top:1px solid var(--line); padding-top:8px;
  }
</style>
</head>

<div class="panel">
  <div class="row">
    <label>Nota (pitch MIDI) <span id="noteVal">60</span></label>
    <input id="note" type="range" min="24" max="96" value="60" step="1" />
  </div>
  <div class="row">
    <label>Velocity <span id="velVal">90</span></label>
    <input id="vel" type="range" min="1" max="127" value="90" step="1" />
  </div>
  <div class="row">
    <label>Duration (ms) <span id="durVal">800</span></label>
    <input id="dur" type="range" min="80" max="4000" value="800" step="20" />
  </div>
  <button id="fire">Disparar evento (simular API)</button>
  <button id="auto" class="secondary">Auto-play (loop de teste)</button>
  <div class="log" id="log">aguardando eventos…</div>
</div>

<script type="module">
import { VFX } from "https://esm.sh/@vfx-js/core";

const img = document.getElementById("img");
const logEl = document.getElementById("log");

function log(msg){
  const t = new Date().toLocaleTimeString();
  logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
}

/* ---------------------------------------------------------------
   Estado compartilhado que o shader lê a cada frame.
   'intensity' sobe no ataque do evento e decai em 'duration' ms.
   'hue' é definido pela nota (ciclo de 12 semitons -> roda de matiz).
------------------------------------------------------------------*/
const state = {
  intensity: 0,   // 0..1, força do efeito (vem da velocity)
  hue: 0,         // 0..1, cor (vem da nota)
  targetIntensity: 0,
  decayEnd: 0,
  decayStart: 0,
  startIntensity: 0,
};

function noteToHue(note){
  // 12 semitons mapeados numa roda de cor (0..1)
  const pc = ((note % 12) + 12) % 12;
  return pc / 12;
}

function triggerNote(note, velocity, durationMs){
  const v = Math.max(0, Math.min(1, velocity / 127));
  state.hue = noteToHue(note);
  state.startIntensity = state.intensity;
  state.targetIntensity = v;
  state.decayStart = performance.now();
  state.decayEnd = state.decayStart + durationMs;
  log(`nota=${note} velocity=${velocity} duration=${durationMs}ms`);
}

function updateEnvelope(now){
  // ataque quase instantâneo, decaimento linear até o fim de 'duration'
  const attackTime = 40; // ms
  if (now - state.decayStart < attackTime){
    const p = (now - state.decayStart) / attackTime;
    state.intensity = state.startIntensity + (state.targetIntensity - state.startIntensity) * Math.min(1, p);
  } else if (now < state.decayEnd){
    const p = (now - (state.decayStart + attackTime)) / (state.decayEnd - state.decayStart - attackTime);
    state.intensity = state.targetIntensity * (1 - Math.min(1, Math.max(0, p)));
  } else {
    state.intensity = 0;
  }
}
requestAnimationFrame(function loop(now){
  updateEnvelope(now);
  requestAnimationFrame(loop);
});

/* ---------------------------------------------------------------
   Shader custom: aberração cromática + leve distorção de onda,
   moduladas por 'intensity', e rotação de matiz modulada por 'hue'.
   A imagem em si fica parada -- só o canvas WebGL por cima dela reage.
------------------------------------------------------------------*/
const shader = `
precision highp float;
uniform vec2 resolution;
uniform vec2 offset;
uniform float time;
uniform sampler2D src;
uniform float intensity;
uniform float hueShift;
out vec4 outColor;

vec3 rotateHue(vec3 c, float a){
  float u = cos(a), w = sin(a);
  mat3 m = mat3(
    0.299 + 0.701*u + 0.168*w, 0.587 - 0.587*u + 0.330*w, 0.114 - 0.114*u - 0.497*w,
    0.299 - 0.299*u - 0.328*w, 0.587 + 0.413*u + 0.035*w, 0.114 - 0.114*u + 0.292*w,
    0.299 - 0.300*u + 1.250*w, 0.587 - 0.588*u - 1.050*w, 0.114 + 0.886*u - 0.203*w
  );
  return clamp(m * c, 0.0, 1.0);
}

void main (void) {
  vec2 uv = (gl_FragCoord.xy - offset) / resolution;

  float wob = sin(uv.y * 18.0 + time * 6.0) * 0.01 * intensity;
  vec2 uvR = uv + vec2(0.012 * intensity + wob, 0.0);
  vec2 uvB = uv - vec2(0.012 * intensity + wob, 0.0);

  float r = texture2D(src, uvR).r;
  float g = texture2D(src, uv).g;
  float b = texture2D(src, uvB).b;
  float a = texture2D(src, uv).a;

  vec3 col = rotateHue(vec3(r, g, b), hueShift * 6.28318);
  outColor = vec4(col, a);
}
`;

const vfx = new VFX();
vfx.add(img, {
  shader,
  overflow: 20,
  uniforms: {
    // funções são reavaliadas todo frame -> sempre lê o estado atual
    intensity: () => state.intensity,
    hueShift: () => state.intensity > 0.02 ? state.hue : 0,
  },
});
